<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="./Netflix Clone_files/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="nav">
            <img class="logo" src="./Netflix Clone_files/Netflix_2015_logo.svg" alt="Netflix Logo">
            <img class="avatar" src="./Netflix Clone_files/picture.webp">
        </div>
    </header>

    <!-- Banner -->
    <section class="banner">
        <div class="banner__contents">
            <h1 class="banner__title">Unlimited movies, Tv shows, and more </h1>
            <div class="banner__buttons">
                <button class="banner__button">Play</button>
                <button class="banner__button">My List</button>
            </div>
            <h1 class="banner__description">Watch this amazing Netflix Original show!</h1>

        
        </div>
        <div class="banner--fadeBottom"></div>
    </section>


    <div class="search-container">
        <input type="text" class="search-bar" placeholder="Search..." aria-label="Search">
        <button class="search-button">🔍</button>
    </div>



    <!-- Netflix Originals -->
    <div class="row">
        <h2>NETFLIX TOP MOVIES IN 2024</h2>
        <div class="row__posters">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/1.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/2.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/3.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/4.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/12.jpg">
        </div>
    </div>

    <!-- Trending Now -->
    <div class="row">
        <h2>Top Rated in 2022</h2>
        <div class="row__posters">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/7.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/8.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/9.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/15.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/18.jpg">
        </div>
    </div>

    <!-- Top Rated -->
    <div class="row">
        <h2>Top Rated in 2019</h2>
        <div class="row__posters">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/10.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/19.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/13.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/16.jpg">
            <img class="row__poster row__posterLarge" src="./Netflix Clone_files/17.jpg">
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer__content">
            <p>© 2025 Netflix Clone</p>
        </div>
    </footer>


</body></html>
